spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - https://mobilebanking.com
              - https://app.mobilebanking.com

logging:
  level:
    root: WARN
    com.mobilebanking.gateway: INFO
    org.springframework.cloud.gateway: WARN

management:
  endpoint:
    health:
      show-details: never
